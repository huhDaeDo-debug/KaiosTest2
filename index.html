<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portal KaiOS</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        h1 {
            font-size: 16px;
            text-align: center;
            color: #00ffcc;
        }
        .menu-item {
            display: block;
            background: #222;
            color: #fff;
            padding: 12px;
            margin: 6px 0;
            text-decoration: none;
            border: 2px solid transparent;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        /* El estilo clave cuando la cruceta selecciona el botón */
        .menu-item.focused {
            background: #00ffcc;
            color: #000;
            border-color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>MIS ACCESOS</h1>

    <!-- Enlaces optimizados para KaiOS -->
    <a href="https://individous.nerdvpn.de" class="menu-item focused">YouTube (Piped Ligero)</a>
    <a href="https://lite.cnn.com" class="menu-item">Noticias Ligeras</a>
    <a href="https://html.duckduckgo.com/html/" class="menu-item">Buscador Básico</a>

    <script>
        // Lógica para moverse con la cruceta (D-Pad) del teléfono
        let items = document.querySelectorAll('.menu-item');
        let currentIndex = 0;

        function updateFocus() {
            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add('focused');
                } else {
                    item.classList.remove('focused');
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown') {
                currentIndex = (currentIndex + 1) % items.length;
                updateFocus();
            } else if (e.key === 'ArrowUp') {
                currentIndex = (currentIndex - 1 + items.length) % items.length;
                updateFocus();
            } else if (e.key === 'Enter') {
                // Al presionar el botón central, abre el enlace seleccionado
                window.location.href = items[currentIndex].href;
            }
        });
    </script>
</body>
</html>
