<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal YouTube KaiOS</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        h1 {
            font-size: 14px;
            text-align: center;
            color: #ff0000;
        }
        .menu-item {
            display: block;
            background: #111;
            color: #fff;
            padding: 10px;
            margin: 5px 0;
            text-decoration: none;
            border: 2px solid #333;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
        }
        .menu-item.focused {
            background: #ff0000;
            color: #fff;
            border-color: #fff;
            font-weight: bold;
        }
        .video-container {
            margin-top: 15px;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 180px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>YOUTUBE LIGERO KAIOS</h1>

    <!-- Enlaces de navegación rápida -->
    <a href="https://m.youtube.com" class="menu-item focused">Abrir YouTube Mobile Oficial</a>
    <a href="https://html.duckduckgo.com/html/" class="menu-item">Buscador Web Auxiliar</a>

    <!-- Reproductor embebido básico HTML (Iframe sin scripts pesados) -->
    <div class="video-container">
        <p style="font-size: 11px; color: #888;">Reproductor de prueba:</p>
        <!-- Usamos un video de muestra embebido directamente con HTML puro -->
        <iframe src="https://www.youtube-nocookie.com/embed/jNQXAC9IVRw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        let items = document.querySelectorAll('.menu-item');
        let currentIndex = 0;

        function updateFocus() {
            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add('focused');
                } else {
                    item.classList.remove('focused');
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown') {
                currentIndex = (currentIndex + 1) % items.length;
                updateFocus();
            } else if (e.key === 'ArrowUp') {
                currentIndex = (currentIndex - 1 + items.length) % items.length;
                updateFocus();
            } else if (e.key === 'Enter') {
                window.location.href = items[currentIndex].href;
            }
        });
    </script>
</body>
</html>
