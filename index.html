<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LiteHub · KaiOS</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.json">
  <style>
    /* ============================================================
       LiteHub · KaiOS — Hoja de estilos unificada
       Target: Nokia 8110 4G / KaiOS 2.5 / Gecko 48 (rv:48.0)
       Sin variables CSS, sin grid, sin flexbox avanzado.
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background-color: #0f1115;
      background-image: -webkit-linear-gradient(top, #0f1115 0%, #141822 100%);
      background-image: linear-gradient(to bottom, #0f1115 0%, #141822 100%);
      background-attachment: fixed;
      color: #e6e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeSpeed; /* Gecko 48: pintado más rápido */
      overflow-x: hidden;
    }
    #app { max-width: 480px; margin: 0 auto; padding: 10px 10px 16px; }
    header { text-align: center; padding: 14px 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.6px; color: #ffffff; text-shadow: 0 0 14px rgba(74,158,255,0.35); }
    header h1 .accent { color: #4a9eff; }
    header p { font-size: 0.75rem; color: #7c8393; margin-top: 4px; letter-spacing: 0.3px; }

    #status {
      text-align: center; font-size: 0.78rem; color: #8b93a3;
      padding: 8px 8px 10px; min-height: 22px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    #back-btn {
      display: none; width: 100%; padding: 11px 12px;
      background: rgba(255,255,255,0.04); color: #c9cfdb;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      font-size: 0.85rem; font-family: inherit; margin-bottom: 10px; cursor: pointer;
    }
    #back-btn:focus {
      outline: none; background: rgba(74,158,255,0.15);
      border-color: #4a9eff; color: #ffffff;
      box-shadow: 0 0 0 2px rgba(74,158,255,0.25);
    }
    #back-btn:active { background: #4a9eff; color: #0f1115; }

    #site-list, #youtube-list { list-style: none; margin-top: 6px; }
    #site-list li, #youtube-list li { margin-bottom: 8px; }

    .site-link {
      display: block; padding: 14px 14px;
      background: rgba(255,255,255,0.04); color: #f0f2f7;
      text-decoration: none; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      border-left: 3px solid #4a9eff;
      font-size: 0.95rem; text-align: left;
      word-break: break-word; overflow-wrap: break-word;
      min-height: 44px; line-height: 1.35;
      /* Sin transition: Gecko 48 repinta más rápido sin animación */
    }
    .site-link:focus {
      outline: none; background: rgba(74,158,255,0.14);
      border-color: #4a9eff; border-left-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(74,158,255,0.25), 0 4px 14px rgba(0,0,0,0.35);
    }
    .site-link:active { background: #4a9eff; color: #0f1115; border-left-color: #0f1115; }

    .site-link .prefix {
      display: inline-block; width: 18px; color: #4a9eff;
      font-weight: 700; margin-right: 4px; text-align: center;
    }
    .site-link:focus .prefix, .site-link:active .prefix { color: inherit; }

    .action-link {
      background: rgba(255,255,255,0.025); color: #8b93a3;
      border-left: 3px solid #3a3f4b; font-size: 0.8rem;
      padding: 11px 12px; min-height: 40px;
    }
    .action-link:focus {
      background: rgba(74,158,255,0.10); color: #ffffff; border-left-color: #4a9eff;
    }

    .section-title {
      font-size: 0.72rem; color: #7c8393; margin: 14px 4px 8px;
      text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
    }

    @media (max-width: 260px) {
      #app { padding: 8px 8px 12px; }
      header h1 { font-size: 1.15rem; }
      header p { font-size: 0.7rem; }
      .site-link { font-size: 0.82rem; padding: 11px 10px; border-radius: 8px; min-height: 40px; }
      .action-link { font-size: 0.72rem; padding: 9px 10px; min-height: 36px; }
      .section-title { font-size: 0.65rem; }
      #status { font-size: 0.7rem; }
      #back-btn { font-size: 0.78rem; padding: 9px 10px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header><h1>Lite<span class="accent">Hub</span></h1><p>Versiones ligeras · KaiOS</p></header>
    <button id="back-btn" type="button" aria-label="Volver al inicio">← Volver</button>
    <div id="status" aria-live="polite"></div>
    <main id="view-home"><ul id="site-list"></ul></main>
    <main id="view-youtube" hidden><p class="section-title">YouTube Lite</p><ul id="youtube-list"></ul></main>
  </div>

  <script>
    (function() {
      'use strict';

      // ==============================================================
      // 1. CONFIGURACIÓN (único punto de cambio)
      // ==============================================================
      var CONFIG = {
        lightTube: {
          label: 'Light-Tube (claro)',
          url:   'http://ligh-tube.localto.net'
        },
        lightTubeTheme: {
          label: 'Alternar tema (oscuro/claro)',
          // Ruta oficial del controlador TogglesController de Light-Tube.
          // Alterna la cookie 'theme' y redirige a la raíz.
          url:   'http://ligh-tube.localto.net/theme?redirectUrl=/'
        },
        backupUrl: 'https://github.com/AllforXP/Ligh-Tube',
        otherSites: [
          // Redlib principal: safereddit.com (sin Cloudflare, v0.36.0)
          { name: 'Reddit (Redlib principal)', url: 'https://safereddit.com' },
          // Redlib respaldo: nadeko.net (sin Cloudflare, v0.36.0)
          { name: 'Reddit (Redlib respaldo)', url: 'https://redlib.nadeko.net' },
          // Wikiless: frontend ligero de Wikipedia sin JS
          { name: 'Wikipedia (Wikiless)', url: 'https://wikiless.tiekoetter.com' },
          { name: 'Hacker News Lite', url: 'https://news.ycombinator.com' },
          { name: 'Google Noticias Lite', url: 'https://news.google.com' }
        ],
        messages: {
          home:     'Selecciona un sitio con las flechas y Enter.',
          youtube:  'Claro u oscuro. Si falla, usa el repo de respaldo.',
          reloaded: 'Lista recargada.',
          noDom:    'Error: no se pudo iniciar la interfaz.'
        }
      };

      // ==============================================================
      // 2. UTILIDADES DOM CON GUARDAS
      // ==============================================================
      function $(sel) { return document.querySelector(sel); }
      var el = {
        viewHome:    $('#view-home'),
        viewYoutube: $('#view-youtube'),
        backBtn:     $('#back-btn'),
        status:      $('#status'),
        siteList:    $('#site-list'),
        youtubeList: $('#youtube-list')
      };
      function domReady() {
        for (var key in el) { if (el.hasOwnProperty(key) && !el[key]) return false; }
        return true;
      }
      if (!domReady()) {
        if (document.body) {
          var fallback = document.createElement('p');
          fallback.style.cssText = 'padding:20px;color:#ff6b6b;font-family:sans-serif;text-align:center;';
          fallback.textContent = CONFIG.messages.noDom;
          document.body.appendChild(fallback);
        }
        if (window.console && console.error) console.error('LiteHub: nodos esenciales ausentes.');
        return;
      }

      // ==============================================================
      // 3. HELPER DE TECLADO (D-pad KaiOS)
      // ==============================================================
      function isActivationKey(e) {
        return e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar' ||
               e.keyCode === 13 || e.keyCode === 32;
      }

      // ==============================================================
      // 4. FÁBRICA DE ÍTEMS (patrón único)
      // ==============================================================
      function createListItem(opts) {
        var li = document.createElement('li');
        var a  = document.createElement('a');
        a.className = 'site-link' + (opts.extraClass ? ' ' + opts.extraClass : '');
        a.href = opts.href;
        if (opts.prefix) {
          var prefixSpan = document.createElement('span');
          prefixSpan.className = 'prefix';
          prefixSpan.setAttribute('aria-hidden', 'true');
          prefixSpan.textContent = opts.prefix;
          a.appendChild(prefixSpan);
        }
        a.appendChild(document.createTextNode(opts.text));
        if (typeof opts.onActivate === 'function') {
          a.setAttribute('role', 'button');
          a.setAttribute('tabindex', '0');
          a.addEventListener('click', function(e) { e.preventDefault(); opts.onActivate(); });
          a.addEventListener('keydown', function(e) {
            if (isActivationKey(e)) { e.preventDefault(); opts.onActivate(); }
          });
        }
        li.appendChild(a);
        return li;
      }

      // ==============================================================
      // 5. FOCO SEGURO
      // ==============================================================
      function focusFirst(container) {
        if (!container) return;
        var first = container.querySelector('.site-link');
        if (first) first.focus();
      }

      // ==============================================================
      // 6. RENDER DE VISTAS
      // ==============================================================
      function renderHome() {
        el.siteList.innerHTML = '';
        el.siteList.appendChild(createListItem({
          text: 'YouTube Lite', href: '#', prefix: '▶', onActivate: showYoutubeView
        }));
        for (var i = 0; i < CONFIG.otherSites.length; i++) {
          var site = CONFIG.otherSites[i];
          el.siteList.appendChild(createListItem({ text: site.name, href: site.url, prefix: '•' }));
        }
        focusFirst(el.siteList);
        el.status.textContent = CONFIG.messages.home;
      }

      function renderYoutubeList(preserveIndex) {
        el.youtubeList.innerHTML = '';
        // Instancia clara
        el.youtubeList.appendChild(createListItem({
          text: CONFIG.lightTube.label, href: CONFIG.lightTube.url, prefix: '▶'
        }));
        // Alternar tema (oscuro/claro) vía ruta oficial /theme
        el.youtubeList.appendChild(createListItem({
          text: CONFIG.lightTubeTheme.label, href: CONFIG.lightTubeTheme.url, prefix: '◐'
        }));
        var reloadIndex = el.youtubeList.children.length;
        // Botón recargar
        el.youtubeList.appendChild(createListItem({
          text: 'Recargar lista', href: '#', extraClass: 'action-link',
          onActivate: function() { renderYoutubeList(reloadIndex); el.status.textContent = CONFIG.messages.reloaded; }
        }));
        // Enlace de respaldo
        el.youtubeList.appendChild(createListItem({
          text: 'Repo oficial de Light-Tube', href: CONFIG.backupUrl, extraClass: 'action-link'
        }));
        var items = el.youtubeList.querySelectorAll('.site-link');
        var idx = (typeof preserveIndex === 'number' && preserveIndex >= 0 && preserveIndex < items.length) ? preserveIndex : 0;
        if (items[idx]) items[idx].focus();
        el.status.textContent = CONFIG.messages.youtube;
      }

      // ==============================================================
      // 7. NAVEGACIÓN ENTRE VISTAS
      // ==============================================================
      function switchView(activeName) {
        var isHome = activeName === 'home';
        el.viewHome.hidden    = !isHome;
        el.viewYoutube.hidden = isHome;
        el.backBtn.style.display = isHome ? 'none' : 'block';
      }
      function showHomeView() { switchView('home'); renderHome(); }
      function showYoutubeView() { switchView('youtube'); renderYoutubeList(); }

      el.backBtn.addEventListener('click', showHomeView);
      el.backBtn.addEventListener('keydown', function(e) {
        if (isActivationKey(e)) { e.preventDefault(); showHomeView(); }
      });

      // ==============================================================
      // 8. INICIALIZACIÓN
      // ==============================================================
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
        document.body.style.paddingTop = '2px';
      }
      renderHome();
      window._litehub = { showHomeView: showHomeView, showYoutubeView: showYoutubeView };
    })();
  </script>
</body>
  </html>
